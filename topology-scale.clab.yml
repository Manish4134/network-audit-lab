name: scale-lab

mgmt:
  network: clab-scale
  ipv4-subnet: 172.21.0.0/16

topology:
  nodes:
    # Real Layer 2 vendor device alongside the emulated farm
    core-srl1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
    huawei-001:
      kind: linux
      image: device-emulator:latest
      env:
        VENDOR_STYLE: huawei
        DEVICE_HOSTNAME: HUAWEI-001
        CONFIG_FILE: /etc/mock/config.txt
      binds:
        - configs/huawei-core1.cfg:/etc/mock/config.txt:ro
    sros-002:
      kind: linux
      image: device-emulator:latest
      env:
        VENDOR_STYLE: sros
        DEVICE_HOSTNAME: SROS-002
        CONFIG_FILE: /etc/mock/config.txt
      binds:
        - configs/sros-pe1.cfg:/etc/mock/config.txt:ro
