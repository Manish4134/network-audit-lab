# TiMOS-B-23.10.R2 both/x86_64 Nokia 7750 SR
exit all
configure
    system
        name "SROS-PE1"
        snmp
            community "public" r version both
        exit
        security
            ssh
                server-version 2
            exit
            telnet-server
        exit
    exit
    router Base
        interface "system"
            address 10.255.0.1/32
            no shutdown
        exit
        interface "to-core"
            address 10.20.1.1/30
            port 1/1/1
            no shutdown
        exit
    exit
exit all
